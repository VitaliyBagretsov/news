info:
  name: Update media
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{backend_url}}/media/{{media_id}}"
  body:
    type: json
    data: |-
      {
        "title": "Updated media",
        "description": "Updated media description",
        "url": "https://example.com",
        "copyright": "Example Media",
        "contact": "Editorial office",
        "chiefEditor": "Editor Name",
        "address": "Moscow",
        "phone": "+7 999 000-00-00",
        "email": "editor@example.com",
        "isActive": true,
        "logo": "https://example.com/logo.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
