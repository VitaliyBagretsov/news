opencollection: 1.0.0

info:
  name: news

request:
  variables:
    - name: backend_url
      value: "http://localhost:{{process.env.BACKEND_PORT}}/api"
    - name: username
      value: "{{process.env.NEWS_USERNAME}}"
    - name: password
      value: "{{process.env.NEWS_PASSWORD}}"
    - name: media_id
      value: "1"
    - name: media_logo_file
      value: ""

bundled: false

extensions:
  bruno:
    ignore:
      - .git
      - node_modules
