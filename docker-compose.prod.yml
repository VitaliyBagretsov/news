services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: news-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - news_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - news_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${NEWS_BACKEND_IMAGE}
    container_name: news-backend
    restart: unless-stopped
    init: true
    env_file:
      - ${NEWS_ENV_FILE:-./.env.prod}
    environment:
      NODE_ENV: production
      BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT must be set}
      MEDIA_IMAGES_DIR: /news/public/images
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TYPEORM_SYNCHRONIZE: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:?BACKEND_PORT must be set}:${BACKEND_PORT:?BACKEND_PORT must be set}"
    volumes:
      - news_media_images:/news/public/images
    networks:
      - news_network
      - gateway_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=- http://127.0.0.1:$${BACKEND_PORT}/api/health >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ${NEWS_FRONTEND_IMAGE}
    container_name: news-frontend
    restart: unless-stopped
    networks:
      - news_network
      - gateway_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=- http://127.0.0.1/healthz >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  news_postgres_data:
  news_media_images:

networks:
  news_network:
    driver: bridge
  gateway_network:
    external: true
    name: ${GATEWAY_NETWORK:-gateway}
