services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: news-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - news_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - news_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-backend
    restart: unless-stopped
    init: true
    env_file:
      - ${NEWS_ENV_FILE:-./.env}
    environment:
      BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT must be set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-true}
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT must be set}:${BACKEND_PORT:?BACKEND_PORT must be set}"
    networks:
      - news_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=- http://127.0.0.1:$${BACKEND_PORT}/api/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  news_postgres_data:

networks:
  news_network:
    driver: bridge
